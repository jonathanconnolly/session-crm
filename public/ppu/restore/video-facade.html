
<!-- PPU video facades (2026-10-21): no video loads until it is wanted -->
<style>
.ppuV-facade{display:block;position:absolute;inset:0;width:100%;height:100%;padding:0;border:0;cursor:pointer;background:#111 center/cover no-repeat;transition:filter .2s}
.ppuV-facade:hover{filter:brightness(1.06)}
.ppuV-facade:focus-visible{outline:3px solid #fff;outline-offset:-3px}
.ppuV-play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:74px;height:74px;border-radius:50%;background:rgba(255,255,255,.92);box-shadow:0 6px 24px rgba(0,0,0,.3);transition:transform .2s}
.ppuV-facade:hover .ppuV-play{transform:translate(-50%,-50%) scale(1.07)}
.ppuV-play::after{content:"";position:absolute;left:52%;top:50%;transform:translate(-50%,-50%);border-style:solid;border-width:13px 0 13px 21px;border-color:transparent transparent transparent #1A1A1A}
@media (max-width:760px){.ppuV-play{width:58px;height:58px}.ppuV-play::after{border-width:10px 0 10px 16px}}
@media (prefers-reduced-motion:reduce){.ppuV-facade,.ppuV-play{transition:none}}
</style>
<script>
(function(){
 var CDN='https://cdn.jsdelivr.net/gh/jonathanconnolly/session-crm@main/public/ppu/img/';
 var P={'1174234823':CDN+'poster-what-to-expect.webp','2hkonPrhGZA':CDN+'poster-gigi.webp'};
 function idOf(s){var m=s.match(/player\.vimeo\.com\/video\/(\d+)/)||s.match(/youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{11})/);return m?m[1]:null}
 function hold(f){var h=f.parentElement;if(h&&getComputedStyle(h).position==='static')h.style.position='relative';return h}
 function facade(f,src){
  var id=idOf(src),p=id&&P[id];if(!p){defer(f,src);return}
  var h=hold(f);if(!h)return;
  f.setAttribute('data-ppu-src',src);f.removeAttribute('src');f.style.display='none';
  var b=document.createElement('button');b.type='button';b.className='ppuV-facade';
  b.setAttribute('aria-label','Play video');b.style.backgroundImage='url("'+p+'")';
  b.appendChild(Object.assign(document.createElement('span'),{className:'ppuV-play'}));
  b.lastChild.setAttribute('aria-hidden','true');
  h.appendChild(b);
  b.addEventListener('click',function(){
   var s=f.getAttribute('data-ppu-src');
   s=s+(s.indexOf(String.fromCharCode(63))>=0?String.fromCharCode(38):String.fromCharCode(63))+'autoplay'+String.fromCharCode(61)+'1';
   f.setAttribute('src',s);f.style.display='';b.parentNode.removeChild(b);
  });
 }
 function defer(f,src){
  f.setAttribute('data-ppu-src',src);f.removeAttribute('src');
  var t=f.closest('section')||f.parentElement;if(!t||!('IntersectionObserver' in window)){f.setAttribute('src',src);return}
  var io=new IntersectionObserver(function(e){e.forEach(function(x){if(x.isIntersecting){f.setAttribute('src',f.getAttribute('data-ppu-src'));io.disconnect()}})},{rootMargin:'300px'});
  io.observe(t);
 }
 function bg(f,src){
  if(window.innerWidth<860){f.removeAttribute('src');f.style.display='none';return}
  defer(f,src);
 }
 function run(){
  var q='iframe[src*="player.vimeo.com"],iframe[src*="youtube.com/embed"],iframe[src*="youtube-nocookie.com/embed"]';
  [].forEach.call(document.querySelectorAll(q),function(f){
   var s=f.getAttribute('src')||'';if(!s)return;
   if(s.indexOf('background'+String.fromCharCode(61)+'1')>=0)bg(f,s);else facade(f,s);
  });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',run);else run();
})();
</script>
