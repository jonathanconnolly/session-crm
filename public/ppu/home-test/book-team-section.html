<!-- PPU /book · v2.1 (2026-10-15) · team section = exact copy of the homepage "ladies behind the lens" section (ppuH- classes) · sits between Now Booking and the reviews block -->
<style>
.ppuH{--ink:#2D2D2D;--text:#373737;--soft:#646363;--paper:#FFFFFF;--cream:#FAF9F5;--blush:#FBDFD9;
--serif:"MADE Mirage","Orpheus Pro","Cormorant Garamond",Georgia,serif;--mono:"Roboto Mono","Courier New",Courier,monospace;
--wrap:1180px;--gut:clamp(16px,4.75vw,67px);text-align:left}
.ppuH,.ppuH *,.ppuH *::before,.ppuH *::after{box-sizing:border-box}
.ppuH [class*="animatable"]{opacity:1!important;transform:none!important}
.ppuH h1,.ppuH h2,.ppuH h3,.ppuH p,.ppuH figure,.ppuH ol{margin:0;padding:0}
.ppuH-sec{width:100vw;margin-left:calc(50% - 50vw);position:relative;background:var(--paper)}
.ppuH-eyebrow{font:500 13px/1 var(--mono)!important;letter-spacing:.2em!important;text-transform:uppercase;color:var(--soft)!important}
.ppuH-team{padding:24px 0 0}
.ppuH-team__head{max-width:980px;margin:0 auto 56px;padding:0 var(--gut);display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.ppuH-team__statement{font:400 clamp(34px,4.4vw,60px)/1.12 var(--serif)!important;color:var(--ink)!important;letter-spacing:-.01em!important;text-transform:none!important;text-wrap:balance}
.ppuH-team__statement em{font-style:italic;white-space:nowrap}
.ppuH-hl{position:relative;z-index:0;padding:0 .06em;white-space:nowrap}
.ppuH-hl::before{content:"";position:absolute;left:0;right:0;top:.14em;bottom:.04em;background:var(--blush);border-radius:4px;z-index:-1;transform:scaleX(0);transform-origin:left center;transition:transform .9s cubic-bezier(.2,.7,.2,1) .25s}
.ppuH-hl.on::before{transform:scaleX(1)}
.ppuH-tmsup{font-size:.38em!important;line-height:0;vertical-align:baseline;position:relative;top:-1.1em;margin-left:.08em;font-family:var(--serif)!important;color:var(--ink)!important}
.ppuH-rail{overflow:hidden}
.ppuH-rail__track{display:flex;width:max-content;animation:ppuHrail 80s linear infinite}
.ppuH-rail:hover .ppuH-rail__track{animation-play-state:paused}
.ppuH-rail__set{display:flex;flex:none}
.ppuH-tm{width:clamp(220px,19vw,300px);flex:none}
.ppuH-tm img{display:block;width:100%;aspect-ratio:2/3;object-fit:cover;background:#eceae6}
.ppuH-rail img{display:block}
@keyframes ppuHrail{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (max-width:760px){.ppuH-tm{width:56vw}}
@media (max-width:480px){.ppuH-team{padding-top:8px}}
@media (prefers-reduced-motion:reduce){.ppuH-rail__track{animation:none}.ppuH-hl::before{transition:none}}
</style>
<div class="ppuH">
<section class="ppuH-sec ppuH-team" aria-label="The ladies behind the lens">

<h2 class="ppuH-team__statement">We are a boutique team of <em>all-female</em> traveling kid photographers, certified in the <span class="ppuH-hl">Personality Method</span><sup class="ppuH-tmsup">™</sup></h2>
</div>

ONALITY-POP-UP-TEAM-0008-e4359385-1500.jpg" alt="" loading="lazy"></figure></div></div></div>

<script>
(function(){
  var els=document.querySelectorAll('.ppuH-hl'); if(!els.length) return;
  if(!('IntersectionObserver' in window)){ els.forEach(function(e){e.classList.add('on');}); return; }
  var io=new IntersectionObserver(function(entries){ entries.forEach(function(en){ if(en.isIntersecting){ en.target.classList.add('on'); io.unobserve(en.target); } }); },{threshold:.6});
  els.forEach(function(e){ io.observe(e); });
})();
</script>
